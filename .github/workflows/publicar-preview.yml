name: Publicar Registro de Servicios Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-registro-servicios-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, curl, mbstring, fileinfo
          coverage: none

      - name: Validar archivos del piloto
        shell: bash
        run: |
          set -euo pipefail
          test -s index.php
          test -s styles.css
          test -s capillas.js
          php -l index.php
          grep -q "pendiente conexión" index.php
          grep -q "disabled" index.php
          echo "Piloto validado: sin envío habilitado a SharePoint."

      - name: Instalar cliente FTPS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validar credenciales de publicación
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}"
          test -n "${FTP_USERNAME:-}"
          test -n "${FTP_PASSWORD:-}"
          echo "Credenciales FTPS presentes."

      - name: Publicar exclusivamente Registro de Servicios Preview
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/deploy_preview_ftps.sh
